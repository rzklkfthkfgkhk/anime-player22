<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream — Твой аниме мир</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">Anime<span>Stream</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск аниме...">
            <button id="searchBtn">Найти</button>
        </div>
    </header>

    <main>
        <div id="animeGrid" class="anime-grid">
            <!-- Сюда будут попадать карточки из JS -->
            <div class="welcome-msg">Введите название, чтобы начать просмотр</div>
        </div>
    </main>

    <!-- Модальное окно для плеера -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="playerContainer">
                <!-- Здесь будет iframe плеера -->
            </div>
            <div id="animeDetails">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
