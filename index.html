<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream — Аниме Каталог</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="#" class="logo" id="logo">Anime<span>Stream</span></a>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск аниме на английском или ромадзи...">
                <button id="search-btn">Найти</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Блок плеера -->
        <section id="player-section" class="player-section hidden">
            <button id="close-player" class="btn-close">✕ Закрыть</button>
            <h2 id="player-title" class="anime-title"></h2>
            <div class="video-container">
                <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div id="anime-info" class="anime-info"></div>
        </section>

        <!-- Каталог -->
        <section class="catalog-section">
            <h2 id="catalog-heading" class="section-title">Популярное аниме</h2>
            <div id="anime-grid" class="anime-grid">
                <div class="loader">Инициализация...</div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
